# Side Quest + a local Ollama serving Gemma. Everything stays on this machine.
#
#   docker compose up -d
#   docker compose exec ollama ollama pull gemma3n:e4b   # writes quests
#   docker compose exec ollama ollama pull gemma4:e4b    # checks photos (vision)
#   open http://localhost:3000
#
# GPU: uncomment the deploy block under `ollama` (NVIDIA Container Toolkit required).

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3n:e4b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-gemma4:e4b}
      DEMO_MODE: ${DEMO_MODE:-0}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama:
