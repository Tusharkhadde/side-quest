# Render Blueprint (alternative to DigitalOcean App Platform).
# Models are hosted, so no GPU is needed: set GOOGLE_API_KEY for Gemma, and
# optionally DO_MODEL_ACCESS_KEY as a fallback. With neither, the built-in
# demo model answers.
services:
  - type: web
    name: side-quest
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDERS
        value: gemma-google,do-gradient,demo
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: DO_MODEL_ACCESS_KEY
        sync: false
      - key: DO_MODEL
        value: gemma-4-31B-it
      - key: ELEVENLABS_API_KEY
        sync: false
