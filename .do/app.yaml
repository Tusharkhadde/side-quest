# DigitalOcean App Platform spec (primary deploy).
#   doctl apps create --spec .do/app.yaml
# Or use the "Deploy to DigitalOcean" button in the README (.do/deploy.template.yaml).
# Models are hosted: Gemma on Google's Gemini API first, then open models on
# DigitalOcean serverless inference, then the built-in demo model. No GPU needed here.
name: side-quest
region: blr
services:
  - name: web
    github:
      repo: Tusharkhadde/side-quest
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /api/health
    envs:
      - key: LLM_PROVIDERS
        scope: RUN_TIME
        value: gemma-google,do-gradient,demo
      - key: GOOGLE_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: GEMMA_MODEL
        scope: RUN_TIME
        value: gemma-4-26b-a4b-it
      - key: DO_MODEL_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: DO_MODEL
        scope: RUN_TIME
        value: gemma-4-31B-it
      - key: DO_VISION_MODEL
        scope: RUN_TIME
        value: nemotron-nano-12b-v2-vl
      - key: ELEVENLABS_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""
